<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | chaloSCF</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header class="site-header" id="navbar">
        <div class="container nav-wrapper">
            <a href="../index.html" class="brand-logo glitch-text-small" data-text="chaloSCF">chaloSCF</a>
            <nav class="main-nav">
                <ul class="nav-list">
                    <li><a href="../About-us/index.html" class="nav-link">About</a></li>
                    <li><a href="../products/index.html" class="nav-link">Work</a></li>
                    <li><a href="index.html" class="nav-link">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="section-pad inner-page contact" style="margin-top: 80px;">
        <div class="container contact-wrapper">
            <h1 class="section-title">Initiate Transmission</h1>
            <form action="#" method="POST" class="contact-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="message">Field Notes</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                <button type="submit" class="btn-solid btn-submit">Send</button>
            </form>
        </div>
    </section>
</body>
</html>
